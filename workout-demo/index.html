     Почему файл, а не sw.js: воркер ставится только после первого захода на

}

/* Player podcast button */
.player-podcast-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  margin-top: 14px;
  background: rgba(140,80,240,0.4);
  border: 1px solid rgba(160,100,255,0.5);
  border-radius: 14px;

/* Player description (collapsible) */

/* ДЕМО: приглашение под видео. Женщина смотрит тренировку и упирается в технику,

}
/* Ролик досмотрен (событие ended плеера Kinescope по протоколу player.js):
   блок мягко подсвечивается. Без всплывающих окон и без прокрутки. */
.demo-upsell.lit {
  background: rgba(140,80,240,0.22);
  border-color: rgba(190,140,255,0.75);
  box-shadow: 0 0 26px rgba(150,90,255,0.28);

  <button id="demoMoreBtn" type="button" onclick="location.href='/?from=demo-workout'"
    style="display:inline-flex;align-items:center;gap:6px;margin:14px 24px 0;padding:8px 14px;background:rgba(140,80,240,0.18);border:1px solid rgba(160,100,255,0.35);border-radius:12px;color:#e0d8f0;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;">← Вернуться</button>

<script>

// ДЕМО: своего бэкенда тут нет. Расписание открытия тренировок не читается,
// единственная тренировка демо открыта всегда. Ссылок в закрытый
// телеграм-канал в этом файле тоже нет ни одной.

// ДЕМО: каталог из ОДНОЙ тренировки, первой. В файле остаётся РОВНО ОДИН
// Kinescope ID: белый список Kinescope доменный, а не постраничный, и любой
// лишний ID заиграл бы у любого, кто откроет исходник.
const WORKOUTS = [
  {
    id: 1, title: 'Тренировка 01',
    src: 'https://kinescope.io/embed/uubwddwtUe1wCwxekvoSnC',
    description: `База курса

База, с которой начинается всё остальное.
Для тех, кто хочет настроить работу диафрагмы и мышц тазового дна, закрыть диастаз и начать путь к плоскому животу.
Если есть диастаз - делай эту тренировку минимум 7 дней.`,
  },
];


let currentTab = 'workouts';

// ДЕМО: вкладка одна, переключать нечего. Функция оставлена пустой, потому
// что на неё может сослаться разметка, а не потому что она что-то делает.
function switchTab(tab) { currentTab = tab; }

// ДЕМО: остальные тренировки программы (названия из боевого workout, без роликов).
// Нажатие ведёт в оформление подписки на app.irenabio.com.
const DEMO_BUY_URL = '/?from=demo-workout&buy=1';
const LOCKED_WORKOUTS = [
  ['Тренировка 02', 'Базовый этап'],
  ['Тренировка 03', 'На силу и контроль'],
  ['Тренировка 04', 'Укрепление корпуса'],
  ['Тренировка 05', 'Максимальный рельеф'],
  ['Тренировка 06', 'Бонусная, с фитболом'],
  ['Тренировка МТД', 'Как заниматься'],
];

async function init() {
  // ДЕМО: расписания нет, тренировка одна и открыта всегда.
  const wList = document.getElementById('workoutList');
  WORKOUTS.forEach((v, idx) => {
    const div = document.createElement('div');
    div.className = 'workout-item';
    div.innerHTML = `
      <div class="workout-num">${String(idx + 1).padStart(2, '0')}</div>
      <div class="workout-info">
        <div class="workout-name">${v.title}</div>
      </div>
      <div class="workout-play"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
    `;
    div.onclick = () => openVideo(v);
    wList.appendChild(div);
  });

  // ДЕМО: остальная программа видна целиком, но под замком. Только названия, роликов нет.
  LOCKED_WORKOUTS.forEach(([title, sub], idx) => {
    const div = document.createElement('div');
    div.className = 'workout-item locked demo-buy';
    div.innerHTML = `
      <div class="workout-num">${String(WORKOUTS.length + idx + 1).padStart(2, '0')}</div>
      <div class="workout-info">
        <div class="workout-name">${title}</div>
        <div class="unlock-soon">${sub} · по подписке</div>
      </div>
      <div class="workout-play">🔒</div>
    `;
    div.onclick = () => { location.href = DEMO_BUY_URL; };
    wList.appendChild(div);
  });

  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('listScreen').classList.add('active');
}

function openVideo(item) {
  document.getElementById('videoFrame').src = item.src;
  document.getElementById('playerTitle').textContent = item.title;

  // ДЕМО: подкаста и самопроверки нет. Оба жили постами в закрытом
  // телеграм-канале, и для пришедшей из браузера это был бы тупик.
  document.getElementById('playerPodcastBtn').style.display = 'none';
  document.getElementById('playerSelfCheckBtn').style.display = 'none';

  // Описание: первая строка - подзаголовок, остальное - body. По умолчанию свёрнуто.
  const desc = document.getElementById('playerDesc');
  if (item.description) {
    const lines = item.description.split('\n');
    const subhead = lines[0];
    const rest = lines.slice(1).join('\n').replace(/^\n+/, '');
    document.getElementById('playerDescSubhead').textContent = subhead;
    document.getElementById('playerDescText').textContent = rest;
    desc.open = false;
    desc.style.display = '';
  } else {
    desc.style.display = 'none';
  }

  document.getElementById('listScreen').classList.remove('active');
  document.getElementById('playerScreen').classList.add('active');
  window.scrollTo(0, 0);

}

function closeVideo() {
  document.getElementById('videoFrame').src = '';
  document.querySelector('.demo-upsell').classList.remove('lit');
  document.getElementById('playerPodcastBtn').onclick = null;
  document.getElementById('playerSelfCheckBtn').onclick = null;
  document.getElementById('playerDesc').open = false;


  document.getElementById('playerScreen').classList.remove('active');
  document.getElementById('listScreen').classList.add('active');
}

// ДЕМО: конец ролика. Kinescope сам события конца не шлёт, но говорит по протоколу
// player.js: присылает {context:"player.js", event:"ready"} строкой JSON, а после
// подписки на "ended" присылает {event:"ended"} (проверено живым прогоном 28.10.2026
// на app.irenabio.com/#urok). Берём сообщения только от нашего iframe.
window.addEventListener('message', function(e) {
  if (e.origin !== 'https://kinescope.io') return;
  const f = document.getElementById('videoFrame');
  if (!f || e.source !== f.contentWindow) return;
  let m = e.data;
  if (typeof m === 'string' && m.charAt(0) === '{') { try { m = JSON.parse(m); } catch (err) { m = null; } }
  if (!m || typeof m !== 'object' || m.context !== 'player.js') return;
  if (m.event === 'ready') {
    f.contentWindow.postMessage(JSON.stringify({ context: 'player.js', version: m.version || '0.0.11',
      method: 'addEventListener', value: 'ended', listener: 'demo_end' }), 'https://kinescope.io');
  } else if (m.event === 'ended') {
    document.querySelector('.demo-upsell').classList.add('lit');
  }
});

// ДЕМО: гейта нет, тренировка открыта сразу.
init().catch(() => {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('listScreen').classList.add('active');
});
</script>
