<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Открываем…</title>

<!-- ============================================================================
     ЗАГЛУШКА-ПЕРЕХОДНИК. Это НЕ страница студии, страница живёт на github.io.

     ЗАЧЕМ. В штатной работе сюда никто не приходит: sw.js перехватывает /studio/
     в браузере и отдаёт файлы с github.io, до сети запрос не доходит. Но воркер
     живёт в браузере, а не на сервере, и есть ветки, где его нет:
       - женщина нажала "назад" после ?sw=off;
       - Safari вычистил воркер за несколько недель простоя, а адрес остался
         в истории или в закладке;
       - ссылкой поделились с тем, у кого воркера нет;
       - иконка на экран Домой поставлена с этой страницы, а не с дома.
     Без заглушки все четыре ветки упирались бы в 404 GitHub Pages - английскую
     страницу "Page not found", которая для женщины выглядит как поломка.
     С заглушкой они дают ровно сегодняшнее поведение: переход на github.io.

     SEARCH И HASH ОБЯЗАТЕЛЬНЫ ОБА. В хэше едет irena_token (см. openMiniApp
     в app.js и irenaConsumeWebToken в studio). Потеряем хэш - женщина попадёт
     в мини-апп без доступа и увидит "нет доступа" вместо практик, то есть
     поломку доступа вместо тихого редиректа. В search едет ?v= кэш-бост.

     location.replace, А НЕ href: replace не оставляет записи в истории. Иначе
     "назад" с github.io возвращал бы сюда, а отсюда снова на github.io -
     женщина оказалась бы заперта между двумя страницами.

     ПЕТЛИ С ВОРКЕРОМ НЕТ. Заглушка не регистрирует воркер (register живёт
     только в app.js) и уводит на ДРУГОЙ origin, а не на себя. Если воркер
     активен, эта страница вообще не запрашивается: SW отвечает раньше сети.
     Если проксирование внутри SW провалилось, он сам делает redirect на
     github.io - тоже мимо заглушки.

     НИЧЕГО НЕ МИГАЕТ. Скрипт стоит в <head> и выполняется до отрисовки body,
     фон совпадает с фоном приложения (--bg: #0B080C), видимого текста нет.
     Английского нет нигде, включая <title>.
     ============================================================================ -->

<style>html, body { margin: 0; height: 100%; background: #0B080C; }</style>
<script>
(function () {
  var TARGET = "https://vladlen00.github.io/studio/";
  var to = TARGET + location.search + location.hash;
  // replace может быть недоступен в редких обёртках - тогда обычный переход.
  try { location.replace(to); } catch (e) { location.href = to; }
})();
</script>
</head>
<body>
<!-- Виден только при выключенном JS. По-русски и без слова "ошибка". -->
<noscript>
  <p style="color:#F5F0E8;font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px">
    <a href="https://vladlen00.github.io/studio/" style="color:#F5F0E8">Открыть практики расслабления</a>
  </p>
</noscript>
</body>
</html>
