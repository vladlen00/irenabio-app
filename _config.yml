# Настройка сборки GitHub Pages.
#
# Pages публикует корень ветки main ЦЕЛИКОМ, и Jekyll вдобавок рендерит
# каждый .md во вторую копию .html. До 22.09.2026 из-за этого по адресам
# app.irenabio.com/CLAUDE.md, /HANDOVER.md, /SECURITY.md и их .html-зеркалам
# отдавались служебные файлы проекта.
#
# Список ниже держит служебное вне боевого домена. Папки, чьё имя начинается
# с подчёркивания, Jekyll не публикует и сам, поэтому _design здесь вторым
# слоем: если кто-то переименует её обратно, строка останется.
#
# ВАЖНО: это НЕ замена приватности. Репозиторий публичный, и всё, что
# коммитится, видно на github.com. Секретам и разбору дыр место в приватном
# biohack-tracker, а не здесь.

exclude:
  - CLAUDE.md
  - HANDOVER.md
  - SECURITY.md
  - README.md
  - preview.html
  - preview-server.py
  - _design
  - design
